<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- connect-src: your relay. Default allows Cloudflare *.workers.dev; add your custom domain if you use one. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src blob:; connect-src https://*.workers.dev http://localhost:8787 http://127.0.0.1:8787; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
  <title>Agent Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="plugin.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Agent Dashboard</h1>
      <span id="connection" data-state="connecting">connecting</span>
    </header>

    <section>
      <h2>Approvals</h2>
      <p class="muted">On the glasses: <b>nod</b> = allow, <b>shake</b> = deny. High-risk actions need a nod, then a button press. Double-click switches between waiting approvals.</p>
      <div id="asks"></div>
    </section>

    <section>
      <h2>Relay</h2>
      <label>Relay URL <input id="relay-url" type="url" placeholder="https://memomind-agent-relay.you.workers.dev" autocomplete="off" spellcheck="false"></label>
      <label>Token <input id="relay-token" type="password" autocomplete="off" spellcheck="false"></label>
      <div class="row">
        <button id="save" type="button">Save &amp; connect</button>
        <button id="test" type="button" class="secondary">Test connection</button>
      </div>
      <p id="status" role="status">Starting…</p>
    </section>

    <section>
      <h2>Activity</h2>
      <pre id="log"></pre>
    </section>
  </main>
</body>
</html>
